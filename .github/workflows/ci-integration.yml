name: integration test

on: [push, pull_request]

env:
  JAVA_OPTS: '-XX:+TieredCompilation -XX:TieredStopAtLevel=1'
  JRUBY_OPTS: '-J-ea'

# runs the suite against every supported Bouncy Castle version
jobs:

  integration:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - ruby-version: jruby-9.4.14.0
            java-version: 11
            profile: test-9.4.14.0
          - ruby-version: jruby-10.0.6.0
            java-version: 21
            profile: test-10.0.6.0
      fail-fast: false

    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: set up java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: set up ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: bundle install
        run: jruby -S bundle install

      - name: build jopenssl.jar
        run: jruby -rbundler/setup -S rake jar

      - name: integration tests
        run: ./mvnw verify -P ${{ matrix.profile }}
