name: ruby-jwt specs

on: [push, pull_request]

env:
  JRUBY_OPTS: '-J-ea'
  SPEC_OPTS: '-fd --force-color'

# runs the vendored ruby-jwt submodule's OpenSSL specs against jruby-openssl
jobs:

  ruby-jwt:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: [ jruby-9.4.14.0, jruby-10.0.6.0 ]
        include:
          - ruby-version: jruby-9.4.14.0
            java-version: 11
          - ruby-version: jruby-10.0.6.0
            java-version: 21
      fail-fast: false

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check out ruby-jwt submodule
        run: git submodule update --init ruby-jwt

      - name: set up java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: set up ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: bundle install
        run: jruby -S bundle install

      - name: build jopenssl.jar
        run: jruby -rbundler/setup -S rake jar

      - name: install ruby-jwt deps
        run: jruby -S rake ruby-jwt:bundle

      - name: ruby-jwt specs
        run: jruby -S rake ruby-jwt:test
